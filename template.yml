AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Employee API (AWS SAM) - Lambda + Layer + API Gateway via OpenAPI

Parameters:

  FunctionName:
    Type: String
    Default: EmployeeApi

  LayerName:
    Type: String
    Default: EmployeeApiDependenciesLayer

  StageName:
    Type: String
    Default: dev

  # This is the manual promotion lever. It does NOT auto-update - bump it
  # by hand (to whatever Lambda version number you want live in prod) and
  # push, whenever you're ready to promote. Find the current dev version
  # number from the LatestVersionArn stack output after any dev deploy.
  ProdFunctionVersion:
    Type: String
    Default: "2"
    Description: Lambda version number manually promoted to the prd alias

Globals:
  Function:
    Runtime: java17
    Timeout: 30
    MemorySize: 512

Resources:

  EmployeeLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: EmployeeLambdaExecutionRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  EmployeeDependenciesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Ref LayerName
      Description: Common runtime dependencies
      ContentUri: target/layer/
      CompatibleRuntimes:
        - java17
      RetentionPolicy: Retain

  EmployeeApiFunction:
    Type: AWS::Serverless::Function
    # CodeUri points at an already-built JAR (produced by our own Maven step),
    # not a source folder. SkipBuild tells `sam build` to carry it forward
    # as-is instead of trying to run a Java build workflow against it.
    Metadata:
      SkipBuild: true
    Properties:
      FunctionName: !Ref FunctionName
      SnapStart:
        ApplyOn: PublishedVersions
      CodeUri: target/employee-api-1.0.jar
      Handler: com.demo.handler.EmployeeApiHandler::handleRequest
      Role: !GetAtt EmployeeLambdaRole.Arn
      Layers:
        - !Ref EmployeeDependenciesLayer
      # Publishes a new immutable Version on every deploy where code
      # changes, and moves the "dev" alias to point at it automatically.
      AutoPublishAlias: dev

  EmployeeApiFunctionProdAlias:
    Type: AWS::Lambda::Alias
    Properties:
      FunctionName: !Ref EmployeeApiFunction
      FunctionVersion: !Ref ProdFunctionVersion
      Name: prd

  EmployeeApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: Employee API
      StageName: !Ref StageName
      # when AWS::Serverless::Api builds its DefinitionBody from
      # an OpenAPI spec, API Gateway's underlying "import" behavior
      # implicitly creates a default Stage deployment stage unless
      #the OpenApiVersion property is explicitly set on the resource
      #https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-resource-api.html -> search OpenApiVersion
      OpenApiVersion: '3.0.1'
      EndpointConfiguration:
        Type: REGIONAL
      # dev stage's Lambda integration resolves the alias to invoke from
      # this stage variable (see openapi.json).
      Variables:
        lambdaAlias: dev
      # DefinitionUri does not support intrinsic functions inside the
      # referenced file. DefinitionBody + AWS::Include splices openapi.json
      # into the template itself before evaluation, so the Fn::Sub blocks
      # inside it resolve normally. `sam package` uploads the local file
      # referenced by Location automatically (documented behavior of the
      # AWS::Include transform's Location parameter).
      DefinitionBody:
        Fn::Transform:
          Name: AWS::Include
          Parameters:
            Location: openapi.json
  # Second stage on the SAME RestApi, reusing SAM's own auto-generated
  # Deployment via its referenceable .Deployment property. Route/path
  # structure is identical to dev - only the lambdaAlias stage variable
  # differs, which is what actually changes which code version runs.
  EmployeeApiProdStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref EmployeeApi
      DeploymentId: !Ref EmployeeApi.Deployment
      StageName: prd
      Variables:
        lambdaAlias: prd
  # Not auto-generated by SAM because the API comes from an external OpenAPI
  # document rather than Function-level "Events" - SAM only auto-wires this
  # permission when it sees an explicit Api event source on the function.
  EmployeeApiPermissionDev:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref EmployeeApiFunction.Alias
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${EmployeeApi}/*/*/*

  EmployeeApiPermissionProd:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref EmployeeApiFunctionProdAlias
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${EmployeeApi}/*/*/*

Outputs:

  LambdaArn:
    Description: Employee API Lambda function ARN (unqualified/$LATEST)
    Value: !GetAtt EmployeeApiFunction.Arn

  LatestVersionArn:
    Description: Most recently auto-published Lambda version - read the version number off this to know what to promote to prd
    Value: !Ref EmployeeApiFunction.Version

  ApiId:
    Description: API Gateway REST API ID
    Value: !Ref EmployeeApi

  DevInvokeURL:
    Description: Invoke URL for the dev stage (always runs latest pushed code)
    Value: !Sub https://${EmployeeApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}

  ProdInvokeURL:
    Description: Invoke URL for the prd stage (runs whatever version is manually promoted)
    Value: !Sub https://${EmployeeApi}.execute-api.${AWS::Region}.amazonaws.com/prd